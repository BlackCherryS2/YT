name: Build YT Pulse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q YT-Pulse-Android-GitHub.zip -d android-project

          echo "=== EXTRACTED FILES ==="
          find android-project -maxdepth 4 -type f | sort

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "=== BUILD DIRECTORY ==="
          pwd
          ls -la

          gradle :app:assembleDebug --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/YT-Pulse-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Pulse-APK
          path: YT-Pulse-debug.apk
          if-no-files-found: error
          retention-days: 14
