name: Build YT Pulse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          echo "=== Repository ==="
          ls -la

          rm -rf android-project
          mkdir android-project

          unzip -q YT-Pulse-Android-GitHub.zip -d android-project

          echo "=== Extracted project ==="
          find android-project -maxdepth 2 -type f | sort

          echo "=== Gradle settings ==="
          find android-project -name "settings.gradle*" -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ./android-project
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          find android-project/app/build/outputs/apk -type f -name "*.apk" -print
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk YT-Pulse-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Pulse-APK
          path: YT-Pulse-debug.apk
          if-no-files-found: error
          retention-days: 14
