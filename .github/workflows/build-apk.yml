name: Build YT Pulse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 업로드된 최신 YT Pulse ZIP 자동 탐색 + 압축 해제
      - name: Find and extract Android project
        shell: bash
        run: |
          echo "=== REPOSITORY FILES ==="
          ls -lah

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'YT-Pulse-Android*.zip' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: YT-Pulse-Android*.zip 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "=== EXTRACTED FILES ==="
          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 5 \
            -type f \
            | sort

      # 3. settings.gradle / settings.gradle.kts 위치 자동 탐색
      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle 또는 settings.gradle.kts를 찾을 수 없습니다."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "================================"
          echo "GRADLE PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 4. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. 환경 확인
      - name: Verify build environment
        shell: bash
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== PROJECT ==="
          cd "${{ steps.project.outputs.project_dir }}"
          pwd
          ls -lah

      # 7. APK 빌드
      - name: Build debug APK
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 8. 생성된 APK 자동 탐색
      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: 생성된 APK를 찾을 수 없습니다."
            exit 1
          fi

          echo "================================"
          echo "APK FOUND"
          echo "$APK_FILE"
          echo "================================"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/YT-Pulse-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/YT-Pulse-debug.apk"

      # 9. APK Artifact 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Pulse-APK
          path: YT-Pulse-debug.apk
          if-no-files-found: error
          retention-days: 14
